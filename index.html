<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/page_logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nadeem Portfolio</title>
    <meta
      name="description"
      content="Explore Nadeem Abdun's portfolio showcasing web development projects, skills, and expertise. Discover innovative solutions, responsive designs, and a passion for creating exceptional user experiences."
    />
    <script>
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // When redirected from 404.html, restore the URL so the SPA router takes over.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
